name: Auto-merge documentation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = context.repo;

            // Only contributors with repository write access.
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...repo,
              username: pr.user.login,
            });

            if (!['write', 'admin'].includes(data.permission)) {
              core.info('Contributor is not a trusted editor.');
              return;
            }

            // Verify every changed file is documentation Markdown.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...repo,
              pull_number: pr.number,
            });

            const allowed = (path) =>
              path.startsWith('src/content/docs/docs/') &&
              path.endsWith('.md');

            if (!files.length || files.some(file =>
              !allowed(file.filename) ||
              (file.previous_filename && !allowed(file.previous_filename))
            )) {
              core.info('PR contains non-documentation changes.');
              return;
            }

            // Let GitHub merge when all branch requirements pass.
            await github.graphql(`
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $id,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number }
                }
              }
            `, { id: pr.node_id });

            core.info(`Enabled auto-merge for PR #${pr.number}`);
